; ff7ec_loader.ini - configuration for the winmm.dll traffic-inspection loader.
; Lives next to the DLL and the game's .exe. Delete a value to use its default.

[loader]
log = 1
; logpath = ff7ec_loader.log

[dns]
; Every hostname the game looks up is answered with redirect_ip, so its
; connections land on the local proxy below instead of going straight out.
redirect_all = 1
redirect_ip = 127.0.0.1
; exclude = some.host.to.leave.alone.example.com
; only = app.gl.ffviiec.com, game-q74z3cyn.app.gl.ffviiec.com

[mitm]
; The local decrypting proxy: terminates the game's TLS with one local,
; self-signed certificate, then makes its own normal connection to the real
; server and relays between them, logging a decrypted copy of each message.
enabled = 1
bind = 127.0.0.1
ports = 443
; Validate the real server's certificate on our own upstream connection.
; Leave this on unless you're pointing at a renamed/replacement server.
upstream_verify = 1
; traffic_log = ff7ec_traffic.log
max_body_log = 4096
; Add the local proxy certificate to this Windows user's trusted root store.
; Not needed for the game itself (see [ssl] below) - only useful if some
; other local tool should also see this traffic without a warning.
install_ca = 0

[ssl]
; Makes the game's own TLS stack accept the local proxy's certificate
; (which is otherwise untrusted). Required for [mitm] to work at all.
bypass = 1

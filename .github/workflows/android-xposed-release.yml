# Builds the FF7EC Xposed/LSPosed traffic logger (android-xposed/) and
# publishes it as a release under the fixed tag `xposedmod`, so there's
# always one stable URL for the latest build - re-running this moves that
# tag to the new commit rather than piling up versioned releases. Mirrors
# android-patches-release.yml's own CI setup (same cmdline-tools dance,
# same reasoning - see that workflow's comments for why), but needs none
# of its Morphe registry credentials: this is a plain Android app module
# plus the public XposedBridge API jar.
name: Build and release Xposed module

on:
  push:
    paths:
      - "android-xposed/**"
      - ".github/workflows/android-xposed-release.yml"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-xposed
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # See android-patches-release.yml for why this installs cmdline-tools
      # fresh rather than assuming the runner image already has them on
      # PATH.
      - name: Install the Android cmdline-tools
        run: |
          : "${ANDROID_SDK_ROOT:=$HOME/android-sdk}"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_SDK_ROOT/cmdline-tools"
          curl -fsSL -o /tmp/cmdline-tools.zip \
            "https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip"
          unzip -q /tmp/cmdline-tools.zip -d "$ANDROID_SDK_ROOT/cmdline-tools"
          mv "$ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools" "$ANDROID_SDK_ROOT/cmdline-tools/latest"
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install platform-tools, NDK, CMake, and the Android 36 platform
        run: sdkmanager --install "platform-tools" "ndk;26.2.11394342" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the module (signed - see app/build.gradle.kts for why debug.keystore is committed, not a secret)
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Locate the built APK
        id: apk
        run: |
          apk=app/build/outputs/apk/release/app-release.apk
          test -f "$apk"
          echo "path=android-xposed/$apk" >> "$GITHUB_OUTPUT"

      - name: Publish the "xposedmod" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: xposedmod
          name: FF7EC Xposed traffic logger
          body: |
            Automated build from ${{ github.sha }} (${{ github.ref_name }}).
            Requires a rooted device with LSPosed (or another active Xposed
            implementation) already running - see android-xposed/README.md.
            Install, enable for FF7 Ever Crisis in LSPosed's manager, then
            reboot/force-stop the game.
          make_latest: true
          files: ${{ steps.apk.outputs.path }}
